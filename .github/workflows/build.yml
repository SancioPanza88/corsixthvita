name: Build VPK (PS Vita)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: vitasdk/vitasdk:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -x
          export VITASDK=/usr/local/vitasdk
          export PATH=$VITASDK/bin:$PATH
          # vdpm has no 'update' subcommand; the image already ships a
          # current database, so go straight to installing.
          # Core set. Each line tolerates a missing package name so a vdpm
          # rename fails loudly at configure time instead of here with a
          # cryptic solver error. Adjust names if vdpm complains.
          vdpm install zlib || echo "NOTE: no vdpm package 'zlib'"
          vdpm install sdl2 || echo "NOTE: no vdpm package 'sdl2'"
          vdpm install sdl2_mixer || vdpm install sdl_mixer || echo "NOTE: no vdpm sdl mixer package"
          vdpm install sdl2_image || echo "NOTE: no vdpm package 'sdl2_image'"
          vdpm install freetype || echo "NOTE: no vdpm package 'freetype'"
          vdpm install libpng || vdpm install png || echo "NOTE: no vdpm png package"
          vdpm install lua || echo "NOTE: no vdpm package 'lua'"
          bash vita/build-lua.sh
          echo "--- SDK include snapshot ---"
          ls "$VITASDK/arm-vita-eabi/include" | head -50 || true

      - name: Configure
        run: |
          set -x
          export VITASDK=/usr/local/vitasdk
          export PATH=$VITASDK/bin:$PATH
          # Upstream ships its own FindSDL2.cmake which honours $SDLDIR.
          export SDLDIR=$VITASDK/arm-vita-eabi
          cmake --version | head -1
          python3 --version || echo "NOTE: no python3 in container"
          echo "--- dep snapshot ---"
          ls "$VITASDK/arm-vita-eabi/lib" | grep -iE 'SDL2|lua|png|freetype|libz|mixer' || true
          ls "$VITASDK/arm-vita-eabi/include" | grep -iE 'SDL|lua|png|freetype|zlib' || true
          ls "$VITASDK/arm-vita-eabi/lib/libSDL2main"* 2>/dev/null || echo "NOTE: no libSDL2main in SDK lib"
          mkdir -p build
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DLUA_INCLUDE_DIR="$VITASDK/arm-vita-eabi/include" \
            -DLUA_LIBRARY="$VITASDK/arm-vita-eabi/lib/liblua.a"

      - name: Build
        run: |
          export VITASDK=/usr/local/vitasdk
          export PATH=$VITASDK/bin:$PATH
          cmake --build build -j"$(nproc)"

      - name: Package VPK
        run: |
          export VITASDK=/usr/local/vitasdk
          export PATH=$VITASDK/bin:$PATH
          cmake --build build --target package-vpk
          ls -la build/*.vpk

      - name: Upload VPK
        uses: actions/upload-artifact@v4
        with:
          name: corsixth-vita-vpk
          path: build/*.vpk
