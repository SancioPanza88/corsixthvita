name: Build VPK (PS Vita)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: vitasdk/vitasdk:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -x
          export VITASDK=/usr/local/vitasdk
          export PATH=$VITASDK/bin:$PATH
          # vdpm has no 'update' subcommand; the image already ships a
          # current database, so go straight to installing.
          # Core set. Each line tolerates a missing package name so a vdpm
          # rename fails loudly at configure time instead of here with a
          # cryptic solver error. Adjust names if vdpm complains.
          vdpm install zlib || echo "NOTE: no vdpm package 'zlib'"
          vdpm install sdl2 || echo "NOTE: no vdpm package 'sdl2'"
          vdpm install sdl2_mixer || vdpm install sdl_mixer || echo "NOTE: no vdpm sdl mixer package"
          vdpm install sdl2_image || echo "NOTE: no vdpm package 'sdl2_image'"
          vdpm install freetype || echo "NOTE: no vdpm package 'freetype'"
          vdpm install libpng || vdpm install png || echo "NOTE: no vdpm png package"
          # Transitive static deps of sdl2_mixer 2.8.2 / freetype (vdpm usually
          # pulls these automatically; install explicitly so a resolver change
          # can never silently drop them). Each line tolerates renames.
          vdpm install libvorbis || vdpm install vorbis || echo "NOTE: no vdpm vorbis package"
          vdpm install libogg || vdpm install ogg || echo "NOTE: no vdpm ogg package"
          vdpm install opusfile || echo "NOTE: no vdpm package 'opusfile'"
          vdpm install opus || echo "NOTE: no vdpm package 'opus'"
          vdpm install libmodplug || vdpm install modplug || echo "NOTE: no vdpm modplug package"
          vdpm install libxmp-lite || vdpm install libxmp || vdpm install xmp || echo "NOTE: no vdpm xmp package"
          vdpm install flac || echo "NOTE: no vdpm package 'flac'"
          vdpm install bzip2 || vdpm install bz2 || echo "NOTE: no vdpm bzip2 package"
          vdpm install lua || echo "NOTE: no vdpm package 'lua'"
          bash vita/build-lua.sh
          echo "--- SDK include snapshot ---"
          ls "$VITASDK/arm-vita-eabi/include" | head -50 || true

      - name: Configure
        run: |
          set -x
          export VITASDK=/usr/local/vitasdk
          export PATH=$VITASDK/bin:$PATH
          # Upstream ships its own FindSDL2.cmake which honours $SDLDIR.
          export SDLDIR=$VITASDK/arm-vita-eabi
          cmake --version | head -1
          python3 --version || echo "NOTE: no python3 in container"
          echo "--- dep snapshot ---"
          ls "$VITASDK/arm-vita-eabi/lib" | grep -iE 'SDL2|lua|png|freetype|libz|mixer' || true
          echo "--- mixer/freetype transitive libs ---"
          ls "$VITASDK/arm-vita-eabi/lib" | grep -iE 'vorbis|ogg|opus|modplug|xmp|FLAC|flac|bz2|mpg123|mikmod' || echo "NOTE: no mixer transitive libs matched"
          echo "--- Sce stubs ---"
          ls "$VITASDK/arm-vita-eabi/lib" | grep -E 'libSce(Gxm|Display|Ctrl|Audio|CommonDialog|Ime|MsgDialog|Touch|Hid|Motion|Sysmodule|AppMgr|AppUtil|Power|Processmgr|Iofilemgr)' || true
          ls "$VITASDK/arm-vita-eabi/include" | grep -iE 'SDL|lua|png|freetype|zlib' || true
          ls "$VITASDK/arm-vita-eabi/lib/libSDL2main"* 2>/dev/null || echo "NOTE: no libSDL2main in SDK lib"
          mkdir -p build
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DLUA_INCLUDE_DIR="$VITASDK/arm-vita-eabi/include" \
            -DLUA_LIBRARY="$VITASDK/arm-vita-eabi/lib/liblua.a"

      - name: Build
        run: |
          export VITASDK=/usr/local/vitasdk
          export PATH=$VITASDK/bin:$PATH
          cmake --build build -j"$(nproc)" || {
            rc=$?
            echo "--- link.txt (CorsixTH) ---"
            cat build/_deps/corsixth_upstream-build/CorsixTH/CMakeFiles/CorsixTH.dir/link.txt 2>/dev/null || true
            echo "--- link.txt (top-level) ---"
            find build -name link.txt | head -20
            exit $rc
          }

      - name: Package VPK
        run: |
          export VITASDK=/usr/local/vitasdk
          export PATH=$VITASDK/bin:$PATH
          cmake --build build --target package-vpk
          ls -la build/*.vpk
          # The firmware rejects non-palette PNGs with 0x8010113D at install
          # time, so fail here instead of on the console.
          python3 - build/*.vpk <<'PY'
          import glob, struct, sys, zipfile
          ok = True
          want = {"sce_sys/icon0.png": (128, 128),
                  "sce_sys/pic0.png": (960, 544),
                  "sce_sys/livearea/contents/bg0.png": (840, 500),
                  "sce_sys/livearea/contents/startup.png": (280, 158)}
          vpk = glob.glob("build/*.vpk")[0]
          with zipfile.ZipFile(vpk) as z:
            names = set(z.namelist())
            for name, (w, h) in want.items():
              if name not in names:
                print(f"FAIL {name}: missing from VPK")
                ok = False
                continue
              data = z.read(name)
              pos = 8
              while pos + 8 <= len(data):
                ln = struct.unpack(">I", data[pos:pos+4])[0]
                if data[pos+4:pos+8] == b"IHDR":
                  pw, ph = struct.unpack(">II", data[pos+8:pos+16])
                  bd, ct = data[pos+16], data[pos+17]
                  good = (bd, ct, pw, ph) == (8, 3, w, h)
                  print(f"{'OK' if good else 'FAIL'} {name}: {pw}x{ph} depth={bd} colortype={ct}")
                  ok = ok and good
                  break
                pos += 12 + ln
              else:
                print(f"FAIL {name}: no IHDR found")
                ok = False
          sys.exit(0 if ok else 1)
          PY

      - name: Upload VPK
        uses: actions/upload-artifact@v4
        with:
          name: corsixth-vita-vpk
          path: build/*.vpk
