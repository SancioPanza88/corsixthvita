name: Build VPK (PS Vita)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: vitasdk/vitasdk:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          export VITASDK=/usr/local/vitasdk
          export PATH=$VITASDK/bin:$PATH
          vdpm update
          # Core set. Each line tolerates a missing package name so a vdpm
          # rename fails loudly at configure time instead of here with a
          # cryptic solver error. Adjust names if vdpm complains.
          vdpm install zlib || true
          vdpm install sdl2 || true
          vdpm install sdl2_mixer || vdpm install sdl_mixer || true
          vdpm install sdl2_image || true
          vdpm install freetype || true
          vdpm install libpng || vdpm install png || true
          vdpm install lua || true
          bash vita/build-lua.sh

      - name: Configure
        run: |
          export VITASDK=/usr/local/vitasdk
          export PATH=$VITASDK/bin:$PATH
          mkdir -p build
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          export VITASDK=/usr/local/vitasdk
          export PATH=$VITASDK/bin:$PATH
          cmake --build build -j"$(nproc)"

      - name: Upload VPK
        uses: actions/upload-artifact@v4
        with:
          name: corsixth-vita-vpk
          path: build/*.vpk
